name: Build & Promote (GitOps)

on:
  push:
    branches: [dev, test, main]
    paths:
      - "frontend/**"
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: bcgov
  SERVICE_FRONTEND: csa-frontend
  SERVICE_BACKEND: csa-backend

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      envname: ${{ steps.env.outputs.envname }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - id: env
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            dev)  echo "envname=dev"  >> "$GITHUB_OUTPUT" ;;
            test) echo "envname=test" >> "$GITHUB_OUTPUT" ;;
            main) echo "envname=prod" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Unsupported branch ${GITHUB_REF_NAME}" ; exit 1 ;;
          esac

      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ steps.env.outputs.envname }}"
          echo "tag=${ENV}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  build-frontend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.SERVICE_FRONTEND }}:${{ needs.detect-changes.outputs.tag }}

  build-backend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.SERVICE_BACKEND }}:${{ needs.detect-changes.outputs.tag }}

  update-gitops:
    needs: [detect-changes, build-frontend, build-backend]
    if: >-
      always() &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true') &&
      (
        (needs.detect-changes.outputs.frontend == 'true' && needs.build-frontend.result == 'success') ||
        (needs.detect-changes.outputs.backend  == 'true' && needs.build-backend.result  == 'success')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v6
        with:
          repository: bcgov-c/tenant-gitops-dec59b
          ref: main
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update overlay image tag(s)
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ needs.detect-changes.outputs.envname }}"
          TAG="${{ needs.detect-changes.outputs.tag }}"

          update_tag () {
            local file="$1"
            local image="$2"

            if [[ ! -f "$file" ]]; then
              echo "ERROR: kustomization not found: $file"
              exit 1
            fi

            # Fail if image entry doesn't exist
            if ! yq e '.images[]? | select(.name=="'"$image"'") | .name' "$file" | grep -q .; then
              echo "ERROR: image '$image' not found in $file"
              exit 1
            fi

            yq -i '(.images[] | select(.name=="'"$image"'")).newTag = "'"$TAG"'"' "$file"
            echo "Updated $image -> $TAG in $file"
          }

          if [[ "${{ needs.detect-changes.outputs.frontend }}" == "true" && "${{ needs.build-frontend.result }}" == "success" ]]; then
            update_tag "gitops/apps/csa-frontend/overlays/${ENV}/kustomization.yaml" "ghcr.io/bcgov/csa-frontend"
          fi

          if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" && "${{ needs.build-backend.result }}" == "success" ]]; then
            update_tag "gitops/apps/csa-backend/overlays/${ENV}/kustomization.yaml" "ghcr.io/bcgov/csa-backend"
          fi

      - name: Show Git diff (debug)
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          git diff --name-only || true
          git diff || true

      - name: Commit & push (dev direct, test/prod PR branch)
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          git config user.email "actions@github.com"
          git config user.name "github-actions"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          ENV="${{ needs.detect-changes.outputs.envname }}"
          TAG="${{ needs.detect-changes.outputs.tag }}"
          BR="promote/${ENV}/${{ github.repository }}-${TAG}"

          if [[ "$ENV" == "dev" ]]; then
            git add .
            git commit -m "Promote to dev: ${{ github.repository }} ${TAG}"
            git push origin main
            echo "Pushed dev promotion directly to GitOps main."
            exit 0
          fi

          # test/prod = create branch then commit & push
          git checkout -b "$BR"
          git add .
          git commit -m "Promote to ${ENV}: ${{ github.repository }} ${TAG}"
          git push -u origin "$BR"
          echo "Created branch $BR in GitOps repo. Open a PR to main."