name: Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [dev, test, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  push:
    branches: [dev, test, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  schedule:
    - cron: "0 11 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend-tests:
    name: Backend Tests
    #if: (! github.event.pull_request.draft)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: default
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: bcgov/action-test-and-analyse@c20d16c26d9b7e6e486f01702880053ed4ebdc91 # v1.5.0
        with:
          commands: |
            npm ci
            npm run lint
            npm run test:cov
          dir: backend
          node_version: "22"
          # sonar_args: >
          #   -Dsonar.exclusions=**/coverage/**,**/node_modules/**,**/*spec.ts
          #   -Dsonar.organization=bcgov-sonarcloud
          #   -Dsonar.projectKey=bcgov-csa-backend
          #   -Dsonar.sources=src
          #   -Dsonar.tests.inclusions=**/*spec.ts
          #   -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
          # sonar_token: ${{ secrets.SONAR_TOKEN }}
          supply_scan: true
          triggers: ('backend/')

  frontend-tests:
    name: Frontend Tests
    #if: (! github.event.pull_request.draft)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-test-and-analyse@c20d16c26d9b7e6e486f01702880053ed4ebdc91 # v1.5.0
        with:
          commands: |
            npm ci
            npm run lint
            npm run test:cov
          dir: frontend
          node_version: "22"
          # sonar_args: >
          #   -Dsonar.exclusions=**/coverage/**,**/node_modules/**,**/*spec.ts
          #   -Dsonar.organization=bcgov-sonarcloud
          #   -Dsonar.projectKey=bcgov-csa-frontend
          #   -Dsonar.sources=src
          #   -Dsonar.tests.inclusions=**/*spec.ts
          #   -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
          # sonar_token: ${{ secrets.SONAR_TOKEN }}
          supply_scan: true
          triggers: ('frontend/')

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    continue-on-error: true
    permissions:
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,config"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  results:
    if: always()
    name: Analysis Results
    needs: [backend-tests, frontend-tests, trivy]
    runs-on: ubuntu-24.04
    steps:
      - if: |
          needs.backend-tests.result != 'success' ||
          needs.frontend-tests.result != 'success'
        run: echo "Backend or Frontend job failed/canceled." && exit 1
      - run: echo "Success!"

