name: Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  schedule:
    - cron: "0 11 * * 0" # Sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal safe defaults; jobs can add more if needed
permissions:
  contents: read

jobs:
  # ----------------------------
  # 1) Detect what changed
  # ----------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            workflows:
              - '.github/workflows/**'

  # ----------------------------
  # 2) Backend tests (only when backend changed, and not draft)
  # ----------------------------
  backend-tests:
    name: Backend Tests
    needs: [changes]
    if: >
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: default
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: bcgov/action-test-and-analyse@c20d16c26d9b7e6e486f01702880053ed4ebdc91
        with:
          commands: |
            npm ci
            npm run lint
            npm run test:cov
          dir: backend
          node_version: "22"
          supply_scan: true
          triggers: ('backend/')

  # ----------------------------
  # 3) Frontend tests (only when frontend changed, and not draft)
  # ----------------------------
  frontend-tests:
    name: Frontend Tests
    needs: [changes]
    if: >
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-test-and-analyse@c20d16c26d9b7e6e486f01702880053ed4ebdc91
        with:
          commands: |
            npm ci
            npm run lint
            npm run test:cov
          dir: frontend
          node_version: "22"
          supply_scan: true
          triggers: ('frontend/')

  # ----------------------------
  # 4) Trivy (run if either changed; skip on draft)
  # ----------------------------
  trivy:
    name: Trivy Security Scan
    needs: [changes]
    if: >
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,config"
          severity: "CRITICAL,HIGH"
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  # ----------------------------
  # 5) Always report ONE required check name: "Analysis Results"
  # ----------------------------
  results:
    name: Analysis Results
    if: always()
    needs: [changes, backend-tests, frontend-tests, trivy]
    runs-on: ubuntu-24.04
    steps:
      - name: Gate on failures only (skipped is OK)
        shell: bash
        run: |
          set -euo pipefail
          echo "backend-tests:  ${{ needs.backend-tests.result }}"
          echo "frontend-tests: ${{ needs.frontend-tests.result }}"
          echo "trivy:         ${{ needs.trivy.result }}"

          for r in "${{ needs.backend-tests.result }}" "${{ needs.frontend-tests.result }}" "${{ needs.trivy.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more jobs failed/cancelled."
              exit 1
            fi
          done

          echo "Success!"