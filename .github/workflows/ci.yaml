name: CI (PR + Manual)

on:
  pull_request:
    branches: [dev]
    paths:
      - "frontend/**"
      - "backend/**"
      - "migrations/**"
      - "backup/**"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target env for manual runs (feature branches default to dev)"
        type: choice
        required: false
        options: [dev, test, prod]
        default: dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      backup: ${{ steps.filter.outputs.backup }}
      envname: ${{ steps.env.outputs.envname }}
      tag: ${{ steps.tag.outputs.tag }}
      backup_tag: ${{ steps.tag.outputs.backup_tag }}
    steps:
      - uses: actions/checkout@v6

      - id: env
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target_env }}" in
              dev)  echo "envname=dev"  >> "$GITHUB_OUTPUT" ;;
              test) echo "envname=test" >> "$GITHUB_OUTPUT" ;;
              prod) echo "envname=prod" >> "$GITHUB_OUTPUT" ;;
              *)    echo "Invalid target_env"; exit 1 ;;
            esac
            exit 0
          fi

          # PR runs: treat as dev (validation only)
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "envname=dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unsupported event: ${GITHUB_EVENT_NAME}"
          exit 1

      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ steps.env.outputs.envname }}"
          SHA7="${GITHUB_SHA::7}"
          echo "tag=${ENV}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            migrations:
              - 'migrations/**'
            backup:
              - 'backup/**'

  coverage-summary:
    name: Coverage Summary (report-only)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ---------- Frontend ----------
      - name: Frontend - install
        if: needs.detect-changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci
        continue-on-error: true

      - name: Frontend - test:coverage (if present)
        if: needs.detect-changes.outputs.frontend == 'true'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          if npm run -s | grep -q '^  test:coverage'; then
            npm run test:coverage
          else
            echo "No frontend test:coverage script yet."
          fi
        continue-on-error: true

      # ---------- Backend ----------
      - name: Backend - install
        if: needs.detect-changes.outputs.backend == 'true' && hashFiles('backend/package-lock.json') != ''
        working-directory: backend
        run: npm ci
        continue-on-error: true

      - name: Backend - test:coverage (if present)
        if: needs.detect-changes.outputs.backend == 'true' && hashFiles('backend/package.json') != ''
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if npm run -s | grep -q '^  test:coverage'; then
            npm run test:coverage
          else
            echo "No backend test:coverage script yet."
          fi
        continue-on-error: true

      # ---------- Migrations ----------
      - name: Migrations - validate folder + Docker build (no push)
        if: needs.detect-changes.outputs.migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating migrations/ structure..."
          test -d migrations
          test -d migrations/sql

          # If you use Dockerfile (recommended)
          if [[ -f migrations/Dockerfile ]]; then
            echo "Found migrations/Dockerfile. Building image (no push)..."
            docker build -f migrations/Dockerfile -t csa-flyway:ci ./migrations
          else
            echo "No migrations/Dockerfile found. Skipping docker build."
            echo "If migrations are intended to ship as an image, add migrations/Dockerfile."
          fi

          # Optional: sanity check SQL files exist
          sql_count=$(find migrations/sql -type f \( -name '*.sql' -o -name '*.SQL' \) | wc -l | tr -d ' ')
          if [[ "$sql_count" -eq 0 ]]; then
            echo "No .sql files found under migrations/sql. Is that expected?"
            exit 1
          fi
          echo "Found $sql_count SQL migration file(s)."

      # ---------- PVC Backup Image----------
      - name: Backup Image - validate Docker build (no push)
        if: needs.detect-changes.outputs.backup == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # If you use Dockerfile (recommended)
          if [[ -f backup/Dockerfile ]]; then
            echo "Found backup/Dockerfile. Building image (no push)..."
            docker build -f backup/Dockerfile -t csa-backup:ci ./backup
          else
            echo "No backup/Dockerfile found. Skipping docker build."
            echo "If backup is intended to ship as an image, add backup/Dockerfile."
            exit 1
          fi



      # ---------- Find cobertura XML (only if generated) ----------
      - name: Find cobertura coverage files
        id: cov
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          files=()
          if [[ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]]; then
            for f in frontend/coverage/**/coverage.cobertura.xml frontend/coverage/**/cobertura-coverage.xml frontend/coverage/**/*.xml; do
              [[ -f "$f" ]] && files+=("$f")
            done
          fi

          if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" ]]; then
            for f in backend/coverage/**/coverage.cobertura.xml backend/coverage/**/cobertura-coverage.xml backend/coverage/**/*.xml; do
              [[ -f "$f" ]] && files+=("$f")
            done
          fi

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          (IFS=,; echo "list=${files[*]}") >> "$GITHUB_OUTPUT"

      - name: Code Coverage Summary
        if: steps.cov.outputs.found == 'true'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ${{ steps.cov.outputs.list }}
          badge: true
          format: markdown
          output: both
          fail_below_min: false

      - name: Add coverage to job summary
        if: steps.cov.outputs.found == 'true'
        shell: bash
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: No coverage yet
        if: steps.cov.outputs.found != 'true'
        shell: bash
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "No Cobertura coverage files found. Once frontend/backend add tests that output Cobertura XML, this will report automatically." >> $GITHUB_STEP_SUMMARY
