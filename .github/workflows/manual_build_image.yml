name: Build Image (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build (e.g. feature/my-branch, dev, commit SHA)"
        required: true
        type: string
      service:
        description: "Which service to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - frontend
          - backend

concurrency:
  group: build-image-manual-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: bcgov
  SERVICE_FRONTEND: csa-frontend
  SERVICE_BACKEND: csa-backend

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          SHA="$(git rev-parse --short=7 HEAD)"
          REF="${{ inputs.ref }}"
          SAFE_REF="${REF//\//-}"
          echo "tag=${SAFE_REF}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        if: inputs.service == 'frontend' || inputs.service == 'both'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.SERVICE_FRONTEND }}:${{ steps.tag.outputs.tag }}

      - name: Build & push backend
        if: inputs.service == 'backend' || inputs.service == 'both'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.SERVICE_BACKEND }}:${{ steps.tag.outputs.tag }}

      - name: Summary
        shell: bash
        run: |
          echo "Built ref: ${{ inputs.ref }}"
          echo "Tag: ${{ steps.tag.outputs.tag }}"